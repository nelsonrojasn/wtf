build:
  environment:
    php:
      version: 8.2

  dependencies:
    override: true

  nodes:
    analysis:
      tests:
        override:
          - true # Salta la etapa de ejecución de herramientas globales

# Anula la ejecución de herramientas a nivel de inspección
tools:
  php_code_sniffer:
    enabled: false
  php_mess_detector:
    enabled: false
  php_cs_fixer:
    enabled: false
  php_loc:
    enabled: false
  sensiolabs_security_checker:
    enabled: false

checks:
  php:
    code_rating: true
    duplication: true
    variable_existence: true
    unused_variables: true
    unused_methods: true
    security_vulnerabilities: true

filter:
  excluded_paths:
    - 'public/'
    - 'bin/'