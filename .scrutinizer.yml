build:
  environment:
    php:
      version: 8.2

  dependencies:
    override: true # Omite 'composer install'

checks:
  php:
    code_rating: true
    duplication: true # Nombre correcto para la detección de código duplicado
    variable_existence: true
    unused_variables: true
    unused_methods: true
    security_vulnerabilities: true

filter:
  excluded_paths:
    - 'public/'
    - 'bin/'
